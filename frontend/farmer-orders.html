
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer Orders - AgriChain</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        .orders-section {
            min-height: calc(100vh - 70px);
            padding: 50px 8%;
            background: #f4f7f4;
        }

        .orders-container {
            max-width: 1100px;
            margin: auto;
        }

        .orders-container h1 {
            color: #1f5f25;
            margin-bottom: 8px;
        }

        .orders-subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        .order-card {
            background: white;
            padding: 25px;
            margin-bottom: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.07);
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
            margin-bottom: 18px;
            gap: 12px;
        }

        .order-id {
            font-weight: bold;
            color: #333;
            word-break: break-all;
        }

        .order-date {
            color: #777;
            font-size: 14px;
            margin-top: 5px;
        }

        .buyer-name {
            font-size: 18px;
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 12px;
        }

        .product-row {
            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .product-name {
            font-weight: bold;
            color: #333;
        }

        .product-details {
            color: #555;
            margin-top: 5px;
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-confirmed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-completed {
            background: #d4edda;
            color: #155724;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .order-total {
            font-size: 19px;
            font-weight: bold;
            color: #1f5f25;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-buttons button {
            padding: 11px 18px;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .confirm-btn {
            background: #2e7d32;
        }

        .confirm-btn:hover {
            background: #256628;
        }

        .complete-btn {
            background: #1565c0;
        }

        .complete-btn:hover {
            background: #0d47a1;
        }

        .cancel-order-btn {
            background: #c62828;
        }

        .cancel-order-btn:hover {
            background: #a51f1f;
        }

        .empty-orders {
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 12px;
            color: #666;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 25px;
            padding: 10px 18px;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .refresh-btn {
            margin-bottom: 25px;
            margin-left: 8px;
            padding: 10px 18px;
            background: white;
            color: #2e7d32;
            border: 1px solid #2e7d32;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .transaction-box {
            margin-top: 15px;
            padding: 12px;
            background: #f5f8f5;
            border-radius: 7px;
        }

        .transaction-box p {
            font-weight: bold;
            color: #2e7d32;
            margin-bottom: 8px;
        }

        .transaction-hash {
            display: block;
            font-size: 12px;
            color: #555;
            word-break: break-all;
            margin-bottom: 8px;
        }

        @media (max-width: 768px) {
            .orders-section {
                padding: 35px 20px;
            }

            .order-header,
            .order-footer {
                flex-direction: column;
                align-items: flex-start;
            }

            .action-buttons {
                width: 100%;
            }

            .action-buttons button {
                flex: 1;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">🌾 AgriChain</div>

        <ul class="nav-links">
            <li><a href="farmer.html">Dashboard</a></li>
            <li><a href="farmer-orders.html">Orders</a></li>
            <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
    </nav>

    <section class="orders-section">
        <div class="orders-container">

            <a href="farmer.html" class="back-btn">
                ← Back to Dashboard
            </a>

            <button class="refresh-btn" onclick="loadOrders()">
                🔄 Refresh Orders
            </button>

            <h1>Incoming Orders</h1>

            <p class="orders-subtitle">
                View orders placed for your products and manage their status.
            </p>

            <div id="ordersContainer">
                <div class="empty-orders">Loading orders...</div>
            </div>

        </div>
    </section>

    <script>
        // =====================================
        // CHECK LOGIN
        // =====================================

        const userData = localStorage.getItem("user");

        if (!userData) {
            alert("Please login first.");
            window.location.href = "login.html";
        }

        let user;

        try {
            user = JSON.parse(userData);
        } catch (error) {
            alert("Invalid login information. Please login again.");
            localStorage.removeItem("user");
            window.location.href = "login.html";
        }

        if (!user || !user.id) {
            alert("User information is missing. Please login again.");
            window.location.href = "login.html";
        }

        // Escape database values before displaying them in HTML.
        function escapeHTML(value) {
            return String(value ?? "").replace(/[&<>"']/g, character => ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            })[character]);
        }

        // =====================================
        // LOAD FARMER ORDERS
        // =====================================

        async function loadOrders() {
            const container = document.getElementById("ordersContainer");

            container.innerHTML = `
                <div class="empty-orders">Loading orders...</div>
            `;

            try {
                // Fetch only this farmer's orders.
                const response = await fetch(
                    `http://localhost:5000/api/orders/farmer/${encodeURIComponent(user.id)}`
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(
                        data.message || "Unable to load farmer orders."
                    );
                }

                const orders = data.orders || [];

                if (orders.length === 0) {
                    container.innerHTML = `
                        <div class="empty-orders">
                            <h2>No Incoming Orders</h2>
                            <p>There are no orders for your products yet.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = "";

                orders.forEach(order => {
                    let productsHTML = "";
                    let farmerSubtotal = 0;

                    (order.products || []).forEach(product => {
                        farmerSubtotal +=
                            Number(product.quantity) * Number(product.price);

                        productsHTML += `
                            <div class="product-row">
                                <div class="product-name">
                                    🌾 ${escapeHTML(product.productName)}
                                </div>

                                <div class="product-details">
                                    Quantity:
                                    ${escapeHTML(product.quantity)}
                                    ${escapeHTML(product.unit)}
                                    <br>

                                    Price per unit:
                                    ₹${Number(product.price).toFixed(2)}
                                    <br>

                                    Subtotal:
                                    ₹${(
                                        Number(product.quantity) *
                                        Number(product.price)
                                    ).toFixed(2)}
                                </div>
                            </div>
                        `;
                    });

                    const status = order.status || "Pending";

                    const statusClass =
                        "status-" + status.toLowerCase();

                    const orderDate = new Date(
                        order.createdAt
                    ).toLocaleString("en-IN");

                    let actionButtons = "";

                    if (status === "Pending") {
                        actionButtons = `
                            <button
                                class="confirm-btn"
                                onclick="confirmOrder('${escapeHTML(order._id)}')">
                                ✅ Confirm Order
                            </button>

                            <button
                                class="cancel-order-btn"
                                onclick="cancelOrder('${escapeHTML(order._id)}')">
                                ❌ Cancel
                            </button>
                        `;
                    } else if (status === "Confirmed") {
                        actionButtons = `
                            <button
                                class="complete-btn"
                                onclick="completeOrder('${escapeHTML(order._id)}')">
                                ✔️ Mark Completed
                            </button>

                            <button
                                class="cancel-order-btn"
                                onclick="cancelOrder('${escapeHTML(order._id)}')">
                                ❌ Cancel
                            </button>
                        `;
                    } else {
                        actionButtons = `
                            <span class="status ${statusClass}">
                                ${escapeHTML(status)}
                            </span>
                        `;
                    }

                    let transactionsHTML = "";

                    if (order.blockchainTransactions?.length) {
                        transactionsHTML = `
                            <div class="transaction-box">
                                <p>🔗 Blockchain Transactions</p>

                                ${order.blockchainTransactions.map(tx => `
                                    <span class="transaction-hash">
                                        ${escapeHTML(tx.productName)}:
                                        ${escapeHTML(tx.transactionHash)}
                                    </span>
                                `).join("")}
                            </div>
                        `;
                    }

                    container.innerHTML += `
                        <div class="order-card">

                            <div class="order-header">
                                <div>
                                    <div class="order-id">
                                        Order ID: ${escapeHTML(order._id)}
                                    </div>

                                    <div class="order-date">
                                        ${escapeHTML(orderDate)}
                                    </div>
                                </div>

                                <span class="status ${statusClass}">
                                    ${escapeHTML(status)}
                                </span>
                            </div>

                            <div class="buyer-name">
                                👤 Buyer: ${escapeHTML(order.buyerName)}
                            </div>

                            ${productsHTML}

                            ${transactionsHTML}

                            <div class="order-footer">
                                <div class="order-total">
                                    Farmer's Product Total:
                                    ₹${farmerSubtotal.toFixed(2)}
                                </div>

                                <div class="action-buttons">
                                    ${actionButtons}
                                </div>
                            </div>

                        </div>
                    `;
                });

            } catch (error) {
                console.error("Load Farmer Orders Error:", error);

                container.innerHTML = `
                    <div class="empty-orders">
                        <h2>Unable to Load Orders</h2>
                        <p>${escapeHTML(error.message)}</p>
                        <p>Please check whether your backend server is running.</p>
                    </div>
                `;
            }
        }

        // =====================================
        // UPDATE ORDER STATUS
        // =====================================

        async function updateOrderStatus(orderId, status) {
    const endpoints = {
        Confirmed: "confirm",
        Completed: "complete",
        Cancelled: "cancel"
    };

    const endpoint = endpoints[status];

    if (!endpoint) {
        alert("Invalid order status");
        return;
    }

    try {
        const response = await fetch(
            `http://localhost:5000/api/orders/${endpoint}/${orderId}`,
            {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                }
            }
        );

        const text = await response.text();
        let data;

        try {
            data = JSON.parse(text);
        } catch {
            throw new Error("Backend returned HTML instead of JSON. Check the API route.");
        }

        if (!response.ok) {
            throw new Error(data.message || "Could not update order");
        }

        alert(data.message || "Order status updated successfully!");
        loadOrders();

    } catch (error) {
        console.error("Order update error:", error);
        alert(error.message);
    }
}

        function confirmOrder(orderId) {
            return updateOrderStatus(orderId, "Confirmed");
        }

        function completeOrder(orderId) {
            return updateOrderStatus(orderId, "Completed");
        }

        function cancelOrder(orderId) {
            return updateOrderStatus(orderId, "Cancelled");
        }

        // =====================================
        // LOGOUT
        // =====================================

        function logout() {
            localStorage.removeItem("user");
            localStorage.removeItem("cart");
            window.location.href = "login.html";
        }

        // =====================================
        // INITIAL LOAD
        // =====================================

        loadOrders();
    </script>

</body>
</html>
