
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriChain Admin Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
        }

        .login-container {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }

        .logo {
            text-align: center;
            font-size: 35px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #1b5e20;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 28px;
            font-size: 14px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2e7d32;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        button:disabled {
            background: #888;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2e7d32;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">🌱</div>

        <h1>AgriChain Admin</h1>

        <p class="subtitle">
            Administrator Login Portal
        </p>

        <form id="adminLoginForm">

            <label for="email">Admin Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit" id="loginButton">
                Login as Admin
            </button>

        </form>

        <p id="message"></p>

        <a href="login.html" class="back-link">
            Back to User Login
        </a>

    </div>

    <script>
        const loginForm = document.getElementById("adminLoginForm");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");

        loginForm.addEventListener("submit", async function(event) {
            console.log("Admin login form submitted!");
            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            message.textContent = "Checking login details...";
            message.style.color = "#555";

            loginButton.disabled = true;

            try {
                const response = await fetch(
                    "http://localhost:5000/api/auth/login",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password,
                            role: "admin"
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || "Login failed");
                }

                // Check admin role and JWT token
                if (
                    !data.user ||
                    data.user.role !== "admin" ||
                    !data.token
                ) {
                    console.log("Login response:", data);
                    throw new Error(
                        "Admin token is missing. Please check backend login."
                    );
                }

                // Clear previous login details
                localStorage.removeItem("user");
                localStorage.removeItem("token");

                // Save new login details
                localStorage.setItem("token", data.token);
                localStorage.setItem(
                    "user",
                    JSON.stringify(data.user)
                );

                message.textContent = "Login successful! Redirecting...";
                message.style.color = "green";

                window.location.href = "admin.html";


            } catch (error) {
                message.textContent = error.message;
                message.style.color = "red";

                console.error("Admin login error:", error);

            } finally {
                loginButton.disabled = false;
            }
        });
    </script>

</body>
</html>
